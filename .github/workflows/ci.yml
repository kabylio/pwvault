name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4        # the browser-crypto interop test runs under Node
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - run: npm install --prefix tests/ui     # jsdom for the interface tests
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Static security analysis (bandit)
        run: bandit -r pwvault pwvault_server -q
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: No secrets or vaults committed
        run: |
          if git ls-files | grep -E '\.(key|pass|db)$|(^|/)\.env$'; then
            echo "secret or vault file is tracked by git"; exit 1; fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pwvault:ci .
